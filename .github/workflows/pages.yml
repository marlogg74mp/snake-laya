# Publishes the browser games to GitHub Pages: the duel at /, the single-player 3D game at /solo/.
# Both run the models client-side (onnxruntime-web), no server needed.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/solo
          cp -r versus/index.html versus/style.css versus/js versus/model_v11w _site/
          cp -r web3d/model _site/model
          cp -r web3d/index.html web3d/style.css web3d/js web3d/model _site/solo/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
